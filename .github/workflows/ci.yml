# CI - runs exactly the same gate developers run locally.
#
# If CI and local run different checks, one of them is decoration - and it is always the one
# that is slower to fix.
#
# This is the live workflow. The template it was copied from is ci/github-actions-ci.yml;
# change both together, or the template quietly stops describing what runs.
#
# ---------------------------------------------------------------------------------------------
# RECONCILED FOR RosiFit, 02-Sep-2026, at framework adoption.
#
# The framework's shipped version of this file ran eleven steps against a scaffolded layout:
# `theme:check`, `theme:contrast`, `theme:assets`, `audit:compat`, and an application half under
# `working-directory: starter` running `lint`, `test:unit` and `test:functional`.
#
# NONE of those exist here. RosiFit was adopted from a copy of the framework, not scaffolded:
# there is no starter/, no fixtures/ and no design/tokens.json, and the app is at the repository
# root. Every one of those steps would have failed on a missing script or a missing file - which
# is a red CI that says nothing, and a red CI that says nothing is switched off within a week.
#
# What follows is only what can actually run. Each omission is recorded with its reason, and the
# accepted-unverifiable classes carry a DECISION_LOG entry and a TECH_DEBT row each (ADR 003).
# ---------------------------------------------------------------------------------------------

name: CI

on:
  push: { branches: [main, dev] }
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          # The ratchets and the fail-first guard both need history, not a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `ci`, never `install`. A CI run that resolves different versions than the lockfile is
      # not testing what will ship.
      - run: npm ci

      # ---- The app's own gates ------------------------------------------------------------
      # `npm run check` is the definition of done for this repository: types, then 2,800
      # contrast pairs across all 360 custom hues in both themes, then all 71 canvas glyphs.
      # These are the SUBSTITUTE RUNGS for the framework's G1-G3 (ADR 001) and they are
      # stronger than the steps they replace, not weaker.

      - name: Types, contrast (2,800 pairs) and icons (71 glyphs)
        run: npm run check

      # ---- Ratcheted audits ---------------------------------------------------------------
      # audit:all, NOT gate. `npm run gate` passes no --dir, so its ratcheted steps see src/
      # only and never app/, where all 30 screens live (ADR 004, TD-008). audit:* runs each
      # audit twice - once per tree, with distinct baselines - so this is the complete check.
      #
      # Every one of these blocks only on a NEW violation, or on a baselined one that was fixed
      # and left listed. Day one blocks nothing that was not already broken.

      - name: All ratchets, both app/ and src/
        run: npm run audit:all

      # ---- The guards ---------------------------------------------------------------------
      # EXECUTES every commit guard against scratch repositories. A source scan cannot tell a
      # live guard from a commented-out one; only running it proves each can still fire.

      - name: Commit guards are reachable
        run: npm run guard:test

      # ---- Deliberately NOT run here, each with its reason --------------------------------
      #
      #   theme:build / theme:check   no design/tokens.json - colour is src/theme/tokens.ts.
      #                               Covered by `npm run check` above.        ADR 001, TD-001
      #   theme:assets                no per-theme brand assets are declared.           TD-003
      #   audit:compat                needs fixtures/ + starter/. It is a FRAMEWORK self-test,
      #                               and here it exits 0 while printing "INERT" - a false
      #                               green, so running it would be worse than not.      TD-007
      #   conformance                 same: framework self-test, needs fixtures/.
      #   lint                        no ESLint configured in this project.              TD-004
      #   test:unit / test:functional no JS test runner configured; these stay unrun.  TD-005, TD-006
      #                               The SQL suite is no longer among them - it runs in the
      #                               db-harness job below, against a real Postgres 16.
      #   gate                        under-covers this repo (src/ only) and exits 2 on the
      #                               five steps whose input does not exist.      ADR 004, TD-008
      #
      # Adding any of them today would produce a permanently red CI whose redness carries no
      # information. Each becomes a real step the moment its input exists; the TECH_DEBT row
      # names the condition.

  # ---- The SQL suite ---------------------------------------------------------------------
  # The 135 assertions under supabase/tests/ are the ONLY automated suite this repository
  # has, and until now nothing ran them: TD-010 recorded the harness as unreachable because
  # the adopting machine had neither psql nor Docker on PATH. A job here depends on no one
  # machine, which is why TECH_DEBT itself named CI the more durable fix.
  #
  # It proves the schema by RECONSTRUCTION, not by comparison: reset.sh drops the database
  # and replays 000_local_shim.sql plus every migration in order before EVERY test file. A
  # migration that only works against an already-migrated database fails here.
  db-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        # Without the health gate the first psql races the container's own startup.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      # The runner needs the CLIENT only -- the server is the service container above.
      # Pinned to 16 to match it.
      - name: Install psql 16
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      # The same command a developer runs. start.sh sees a TCP PGHOST, confirms the service
      # container is reachable and steps aside; test.sh then runs the suite unchanged.
      - name: Migrations replay clean, and all 135 assertions pass
        run: npm run test:db
