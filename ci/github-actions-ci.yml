# CI - runs exactly the same gate developers run locally.
#
# If CI and local run different checks, one of them is decoration - and it is always the one
# that is slower to fix.
#
# Copy to .github/workflows/ci.yml -- and keep the two identical. This file is the template;
# .github/workflows/ci.yml is what actually runs.
#
# ---------------------------------------------------------------------------------------------
# RECONCILED FOR RosiFit, 02-Sep-2026, at framework adoption.
#
# The framework's shipped version of this file ran eleven steps against a scaffolded layout:
# `theme:check`, `theme:contrast`, `theme:assets`, `audit:compat`, and an application half under
# `working-directory: starter` running `lint`, `test:unit` and `test:functional`.
#
# NONE of those exist here. RosiFit was adopted from a copy of the framework, not scaffolded:
# there is no starter/, no fixtures/ and no design/tokens.json, and the app is at the repository
# root. Every one of those steps would have failed on a missing script or a missing file - which
# is a red CI that says nothing, and a red CI that says nothing is switched off within a week.
#
# What follows is only what can actually run. Each omission is recorded with its reason, and the
# accepted-unverifiable classes carry a DECISION_LOG entry and a TECH_DEBT row each (ADR 003).
# ---------------------------------------------------------------------------------------------

name: CI

on:
  push: { branches: [main, dev] }
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          # The ratchets and the fail-first guard both need history, not a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `ci`, never `install`. A CI run that resolves different versions than the lockfile is
      # not testing what will ship.
      - run: npm ci

      # ABOVE `npm run check`, DELIBERATELY (T-401, and see T-402).
      # This step is where T-401's adapter spec runs, and a job stops at its first failed
      # step. `npm run check` has been red on every run since CI first executed on 11-Sep,
      # so this step has never once executed - which is how the adapter went five days
      # judging the wrong repository with nothing to notice. Shipping the fix underneath a
      # step that never runs would have repeated the defect it corrects.
      #
      # `audit:all` is still stranded below `check`. That is T-402, not this row.
      # ---- The guards ---------------------------------------------------------------------
      # EXECUTES every commit guard against scratch repositories. A source scan cannot tell a
      # live guard from a commented-out one; only running it proves each can still fire.

      - name: Commit guards are reachable
        run: npm run guard:test

      # ---- Edge Function specs -------------------------------------------------------------
      # The Deno tree has never had a runner. `npm run check` is Node and scoped to src/, so
      # nothing under supabase/functions/ was executed by any job - which is why T-020's proof
      # had nowhere to live until this step existed (T-012 precedent: build the proof surface
      # before the fix that needs it).
      #
      # Type checking arrived with T-027 and runs inside `npm run check` as `check:edge`,
      # which invokes `deno check` over every .ts under supabase/functions/. That is why
      # setup-deno sits above the app's own gates: `npm run check` now needs Deno on PATH
      # to do the Edge half of its job.
      #
      # This step stays `deno test` and drops --no-check, so a spec that no longer type
      # checks fails here as well as in check:edge. Two rungs, same tree, different reasons.

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Edge Function specs
        working-directory: supabase/functions
        run: deno test

      # ---- The app's own gates ------------------------------------------------------------
      # `npm run check` is the definition of done for this repository: types, then 2,800
      # contrast pairs across all 360 custom hues in both themes, then all 71 canvas glyphs.
      # These are the SUBSTITUTE RUNGS for the framework's G1-G3 (ADR 001) and they are
      # stronger than the steps they replace, not weaker.

      - name: Lint, types, contrast (2,800 pairs) and icons (71 glyphs)
        run: npm run check

      # ---- Ratcheted audits ---------------------------------------------------------------
      # audit:all, NOT gate. `npm run gate` passes no --dir, so its ratcheted steps see src/
      # only and never app/, where all 30 screens live (ADR 004, TD-008). audit:* runs each
      # audit twice - once per tree, with distinct baselines - so this is the complete check.
      #
      # Every one of these blocks only on a NEW violation, or on a baselined one that was fixed
      # and left listed. Day one blocks nothing that was not already broken.

      - name: All ratchets, both app/ and src/
        run: npm run audit:all

      # ---- Deliberately NOT run here, each with its reason --------------------------------
      #
      #   theme:build / theme:check   no design/tokens.json - colour is src/theme/tokens.ts.
      #                               Covered by `npm run check` above.        ADR 001, TD-001
      #   theme:assets                no per-theme brand assets are declared.           TD-003
      #   audit:compat                needs fixtures/ + starter/. It is a FRAMEWORK self-test,
      #                               and here it exits 0 while printing "INERT" - a false
      #                               green, so running it would be worse than not.      TD-007
      #   conformance                 same: framework self-test, needs fixtures/.
      #   test:functional             no functional runner exists; this one stays unrun.     TD-006
      #                               Two former entries have left this list, and both had
      #                               gone stale long before T-035 removed them (RV-22):
      #                               `lint` said "no ESLint configured in this project"
      #                               while eslint.config.mjs sat in the repository root
      #                               carrying the src/data boundary rule - configured is
      #                               exactly what it was; INSTALLED is what it was not.
      #                               `test:unit` said "no JS test runner configured" while
      #                               `npm run check` above was already running the whole
      #                               unit suite through `tsx --test`. A comment that names
      #                               a step as unrun while the step above runs it is worse
      #                               than no comment: it is read as a statement of scope.
      #                               The SQL suite left this list earlier - it runs in the
      #                               db-harness job below.
      #   gate                        under-covers this repo (src/ only) and exits 2 on the
      #                               five steps whose input does not exist.      ADR 004, TD-008
      #
      # Adding any of them today would produce a permanently red CI whose redness carries no
      # information. Each becomes a real step the moment its input exists; the TECH_DEBT row
      # names the condition.

  # ---- The SQL suite ---------------------------------------------------------------------
  # The assertions under supabase/tests/ are no longer the only automated suite this
  # repository has - `npm run check` in the gate job above runs the unit suite, and the
  # count here used to say 135, which it has not been for a long time. Neither claim is
  # restated with a fresh number, because a hand-maintained count in a comment is the
  # thing that went stale (RV-22, T-012). The suite reports its own totals; read them
  # in the job output.
  #
  # Nothing ran these at all until CI did: TD-010 recorded the harness as unreachable because
  # the adopting machine had neither psql nor Docker on PATH. A job here depends on no one
  # machine, which is why TECH_DEBT itself named CI the more durable fix.
  #
  # It proves the schema by RECONSTRUCTION, not by comparison: reset.sh drops the database
  # and replays 000_local_shim.sql plus every migration in order before EVERY test file. A
  # migration that only works against an already-migrated database fails here.
  db-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        # Without the health gate the first psql races the container's own startup.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      # The runner needs the CLIENT only -- the server is the service container above.
      # Pinned to 16 to match it.
      - name: Install psql 16
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      # The same command a developer runs. start.sh sees a TCP PGHOST, confirms the service
      # container is reachable and steps aside; test.sh then runs the suite unchanged.
      # NOT "and all N assertions pass". The name said 135 for months while the real figure
      # moved through 776 and past 790, so the name was not a check on anything - it was a
      # number nobody updated, on the one job whose verdict was already going unread (T-012).
      # A step name cannot go stale if it does not carry a count.
      - name: Migrations replay clean and the spec suite runs
        run: npm run test:db
